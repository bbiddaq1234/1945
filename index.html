<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>갤러그</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #05060f;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Courier New", monospace;
    overflow: hidden;
  }
  #wrap {
    position: relative;
    width: 480px;
    max-width: 100vw;
    aspect-ratio: 480 / 640;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: #05060f;
    border: 2px solid #1b2140;
    box-shadow: 0 0 40px rgba(80, 120, 255, 0.25);
    image-rendering: pixelated;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: #dfe6ff;
    background: rgba(5, 6, 15, 0.82);
    gap: 14px;
    padding: 20px;
  }
  #overlay.hidden { display: none; }
  #overlay h1 {
    font-size: 40px;
    letter-spacing: 6px;
    color: #ffe14d;
    text-shadow: 0 0 12px rgba(255, 225, 77, 0.6);
  }
  #overlay p { font-size: 15px; line-height: 1.7; color: #9fb0e0; }
  #overlay .key { color: #7cf6ff; }
  #overlay button {
    margin-top: 8px;
    padding: 12px 28px;
    font-family: inherit;
    font-size: 16px;
    font-weight: bold;
    letter-spacing: 2px;
    color: #05060f;
    background: #7cf6ff;
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }
  #overlay button:hover { background: #ffe14d; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="480" height="640"></canvas>
  <div id="overlay">
    <h1>GALAGA</h1>
    <p>
      이동: <span class="key">← →</span> 또는 <span class="key">A D</span><br>
      발사: <span class="key">Space</span> &nbsp;·&nbsp; 일시정지: <span class="key">P</span><br>
      모바일: <span class="key">화면을 끌어</span> 이동, 누르는 동안 자동 발사
    </p>
    <p id="msg"></p>
    <button id="startBtn">START</button>
  </div>
</div>
<script>
(function () {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const overlay = document.getElementById('overlay');
  const msgEl = document.getElementById('msg');
  const startBtn = document.getElementById('startBtn');

  const keys = {};
  window.addEventListener('keydown', e => {
    if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key)) e.preventDefault();
    keys[e.key.toLowerCase()] = true;
    if (e.key.toLowerCase() === 'p' && state === 'play') paused = !paused;
  });
  window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

  // ---- Touch controls: drag to move, hold to auto-fire ----
  const touch = { active: false, x: 0 };
  function touchX(t) {
    const r = canvas.getBoundingClientRect();
    return (t.clientX - r.left) / r.width * W;
  }
  function onTouch(e) {
    e.preventDefault();
    if (state !== 'play') { if (e.type === 'touchstart') start(); return; }
    touch.active = true;
    touch.x = touchX(e.touches[0]);
  }
  canvas.addEventListener('touchstart', onTouch, { passive: false });
  canvas.addEventListener('touchmove', onTouch, { passive: false });
  canvas.addEventListener('touchend', e => { e.preventDefault(); touch.active = false; }, { passive: false });
  canvas.addEventListener('touchcancel', () => { touch.active = false; });

  // ---- Stars background ----
  const stars = [];
  for (let i = 0; i < 90; i++) {
    stars.push({ x: Math.random() * W, y: Math.random() * H, s: Math.random() * 2 + 0.4, v: Math.random() * 40 + 15 });
  }

  // ---- Game state ----
  let state = 'menu';       // menu | play | over
  let paused = false;
  let score = 0, hiScore = 0, lives = 3, wave = 1;
  let player, bullets, enemyBullets, enemies, particles;
  let lastTime = 0, spawnTimer = 0, playerShootCd = 0, respawnInv = 0;

  function resetGame() {
    score = 0; lives = 3; wave = 1;
    bullets = []; enemyBullets = []; particles = [];
    player = { x: W / 2, y: H - 60, w: 34, h: 26, speed: 260, alive: true };
    buildWave();
  }

  // ---- Enemy formation ----
  let formation;
  function buildWave() {
    enemies = [];
    const cols = 8, rows = Math.min(3 + Math.floor(wave / 2), 5);
    const gapX = 44, gapY = 40;
    const startX = (W - (cols - 1) * gapX) / 2;
    const startY = 80;
    formation = { dir: 1, speed: 30 + wave * 6, offsetX: 0, offsetY: 0 };
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const type = r === 0 ? 'boss' : (r === 1 ? 'mid' : 'grunt');
        enemies.push({
          homeX: startX + c * gapX,
          homeY: startY + r * gapY,
          x: startX + c * gapX,
          y: startY + r * gapY - 300 - r * 20,
          w: 30, h: 24,
          type,
          hp: type === 'boss' ? 2 : 1,
          state: 'enter',        // enter | formation | dive
          diveT: 0,
          divePath: null,
          shootCd: Math.random() * 3 + 1,
          wob: Math.random() * Math.PI * 2
        });
      }
    }
  }

  // ---- Helpers ----
  function rectHit(a, b) {
    return Math.abs(a.x - b.x) * 2 < (a.w + b.w) && Math.abs(a.y - b.y) * 2 < (a.h + b.h);
  }
  function spawnParticles(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      const ang = Math.random() * Math.PI * 2;
      const sp = Math.random() * 140 + 30;
      particles.push({ x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, life: 0.6, max: 0.6, color });
    }
  }

  // ---- Update ----
  function update(dt) {
    for (const s of stars) {
      s.y += s.v * dt;
      if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
    }
    if (state !== 'play' || paused) return;

    if (respawnInv > 0) respawnInv -= dt;

    // Player move
    let mv = 0;
    if (keys['arrowleft'] || keys['a']) mv -= 1;
    if (keys['arrowright'] || keys['d']) mv += 1;
    if (touch.active) {
      const d = touch.x - player.x;
      player.x += Math.max(-player.speed * dt * 1.8, Math.min(player.speed * dt * 1.8, d));
    } else {
      player.x += mv * player.speed * dt;
    }
    player.x = Math.max(player.w / 2, Math.min(W - player.w / 2, player.x));

    // Player shoot
    playerShootCd -= dt;
    if ((keys[' '] || touch.active) && playerShootCd <= 0 && player.alive) {
      bullets.push({ x: player.x, y: player.y - 18, w: 4, h: 14, vy: -520 });
      playerShootCd = 0.28;
    }

    // Bullets
    for (const b of bullets) b.y += b.vy * dt;
    bullets = bullets.filter(b => b.y > -20);
    for (const b of enemyBullets) { b.y += b.vy * dt; b.x += (b.vx || 0) * dt; }
    enemyBullets = enemyBullets.filter(b => b.y < H + 20);

    // Formation drift
    formation.offsetX += formation.dir * formation.speed * dt;
    if (formation.offsetX > 24) { formation.offsetX = 24; formation.dir = -1; }
    if (formation.offsetX < -24) { formation.offsetX = -24; formation.dir = 1; }

    // Enemies
    let anyEntering = false;
    for (const e of enemies) {
      e.wob += dt * 3;
      if (e.state === 'enter') {
        anyEntering = true;
        const tx = e.homeX + formation.offsetX;
        const ty = e.homeY;
        e.x += (tx - e.x) * Math.min(1, dt * 3);
        e.y += (ty - e.y) * Math.min(1, dt * 3);
        if (Math.abs(e.x - tx) < 2 && Math.abs(e.y - ty) < 2) e.state = 'formation';
      } else if (e.state === 'formation') {
        e.x = e.homeX + formation.offsetX + Math.sin(e.wob) * 3;
        e.y = e.homeY + Math.sin(e.wob * 0.6) * 2;
      } else if (e.state === 'dive') {
        e.diveT += dt;
        const p = e.divePath;
        const t = Math.min(1, e.diveT / p.dur);
        // quadratic bezier
        const it = 1 - t;
        e.x = it*it*p.x0 + 2*it*t*p.cx + t*t*p.x1;
        e.y = it*it*p.y0 + 2*it*t*p.cy + t*t*p.y1;
        if (t >= 1) {
          // loop back to formation from top
          e.state = 'enter';
          e.y = -30;
          e.x = e.homeX + formation.offsetX;
        }
      }

      // Enemy shooting
      e.shootCd -= dt;
      if (e.shootCd <= 0 && (e.state === 'formation' || e.state === 'dive') && e.y < H - 120) {
        e.shootCd = Math.random() * 2.5 + 1.5;
        if (Math.random() < (e.state === 'dive' ? 0.9 : 0.35)) {
          const dx = player.x - e.x, dy = player.y - e.y;
          const d = Math.hypot(dx, dy) || 1;
          enemyBullets.push({ x: e.x, y: e.y + 12, w: 5, h: 12, vy: (dy / d) * 220, vx: (dx / d) * 220 });
        }
      }
    }

    // Trigger dives
    spawnTimer -= dt;
    if (spawnTimer <= 0 && !anyEntering) {
      spawnTimer = Math.max(0.6, 2.2 - wave * 0.15);
      const cands = enemies.filter(e => e.state === 'formation');
      if (cands.length) {
        const e = cands[Math.floor(Math.random() * cands.length)];
        e.state = 'dive';
        e.diveT = 0;
        const side = Math.random() < 0.5 ? -1 : 1;
        e.divePath = {
          x0: e.x, y0: e.y,
          cx: e.x + side * (120 + Math.random() * 120), cy: e.y + 180,
          x1: player.x + (Math.random() * 160 - 80), y1: H + 40,
          dur: 1.8 + Math.random() * 0.6
        };
      }
    }

    // Collisions: player bullets vs enemies
    for (const b of bullets) {
      for (const e of enemies) {
        if (rectHit(b, e)) {
          b.dead = true;
          e.hp--;
          spawnParticles(e.x, e.y, '#ffd23f', 6);
          if (e.hp <= 0) {
            e.dead = true;
            const pts = e.type === 'boss' ? 150 : e.type === 'mid' ? 80 : 50;
            score += (e.state === 'dive' ? pts * 2 : pts);
            spawnParticles(e.x, e.y, '#ff5d5d', 18);
          }
          break;
        }
      }
    }
    bullets = bullets.filter(b => !b.dead);
    enemies = enemies.filter(e => !e.dead);

    // Collisions: enemy bullets / bodies vs player
    if (player.alive && respawnInv <= 0) {
      for (const b of enemyBullets) {
        if (rectHit(b, player)) { b.dead = true; hitPlayer(); break; }
      }
      for (const e of enemies) {
        if (rectHit(e, player)) { spawnParticles(e.x, e.y, '#ff5d5d', 16); e.dead = true; hitPlayer(); break; }
      }
      enemyBullets = enemyBullets.filter(b => !b.dead);
      enemies = enemies.filter(e => !e.dead);
    }

    // Particles
    for (const p of particles) {
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vx *= 0.94; p.vy *= 0.94;
      p.life -= dt;
    }
    particles = particles.filter(p => p.life > 0);

    // Wave clear
    if (enemies.length === 0) {
      wave++;
      score += 200;
      buildWave();
      respawnInv = 1;
    }
  }

  function hitPlayer() {
    lives--;
    spawnParticles(player.x, player.y, '#7cf6ff', 26);
    respawnInv = 2;
    player.x = W / 2;
    if (lives <= 0) {
      player.alive = false;
      gameOver();
    }
  }

  function gameOver() {
    state = 'over';
    hiScore = Math.max(hiScore, score);
    overlay.classList.remove('hidden');
    overlay.querySelector('h1').textContent = 'GAME OVER';
    msgEl.innerHTML = `SCORE <span class="key">${score}</span> &nbsp; HI <span class="key">${hiScore}</span> &nbsp; WAVE <span class="key">${wave}</span>`;
    startBtn.textContent = 'RETRY';
  }

  // ---- Draw ----
  function draw() {
    ctx.fillStyle = '#05060f';
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = '#aab6e8';
    for (const s of stars) { ctx.globalAlpha = s.s / 2.4; ctx.fillRect(s.x, s.y, s.s, s.s); }
    ctx.globalAlpha = 1;

    if (state === 'menu') { drawHud(); return; }

    // particles
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;

    // bullets
    ctx.fillStyle = '#7cf6ff';
    for (const b of bullets) ctx.fillRect(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h);
    ctx.fillStyle = '#ff8a3d';
    for (const b of enemyBullets) ctx.fillRect(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h);

    // enemies
    for (const e of enemies) drawEnemy(e);

    // player
    if (player.alive && !(respawnInv > 0 && Math.floor(respawnInv * 12) % 2)) drawPlayer();

    drawHud();

    if (paused) {
      ctx.fillStyle = 'rgba(5,6,15,0.6)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#ffe14d';
      ctx.font = 'bold 32px "Courier New", monospace';
      ctx.textAlign = 'center';
      ctx.fillText('PAUSED', W / 2, H / 2);
      ctx.textAlign = 'left';
    }
  }

  function drawPlayer() {
    const { x, y } = player;
    ctx.fillStyle = '#e8eeff';
    ctx.beginPath();
    ctx.moveTo(x, y - 14);
    ctx.lineTo(x - 16, y + 12);
    ctx.lineTo(x - 6, y + 12);
    ctx.lineTo(x - 6, y + 4);
    ctx.lineTo(x + 6, y + 4);
    ctx.lineTo(x + 6, y + 12);
    ctx.lineTo(x + 16, y + 12);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#7cf6ff';
    ctx.fillRect(x - 3, y - 6, 6, 10);
    ctx.fillStyle = '#ff5d5d';
    ctx.fillRect(x - 2, y + 10, 4, 5);
  }

  function drawEnemy(e) {
    const { x, y } = e;
    let c1, c2;
    if (e.type === 'boss') { c1 = '#ff5d5d'; c2 = '#ffd23f'; }
    else if (e.type === 'mid') { c1 = '#c07cff'; c2 = '#7cf6ff'; }
    else { c1 = '#4de1ff'; c2 = '#e8eeff'; }
    ctx.fillStyle = c1;
    ctx.fillRect(x - 13, y - 6, 26, 12);
    ctx.fillRect(x - 8, y - 11, 16, 6);
    ctx.fillStyle = c2;
    ctx.fillRect(x - 13, y + 4, 5, 6);
    ctx.fillRect(x + 8, y + 4, 5, 6);
    ctx.fillRect(x - 3, y - 3, 6, 6);
  }

  function drawHud() {
    ctx.fillStyle = '#dfe6ff';
    ctx.font = '14px "Courier New", monospace';
    ctx.textAlign = 'left';
    ctx.fillText('SCORE ' + score, 12, 22);
    ctx.textAlign = 'right';
    ctx.fillText('HI ' + Math.max(hiScore, score), W - 12, 22);
    ctx.textAlign = 'left';
    ctx.fillText('WAVE ' + wave, 12, 40);
    // lives
    for (let i = 0; i < lives; i++) {
      const lx = W - 20 - i * 22, ly = 36;
      ctx.fillStyle = '#7cf6ff';
      ctx.beginPath();
      ctx.moveTo(lx, ly - 7);
      ctx.lineTo(lx - 8, ly + 6);
      ctx.lineTo(lx + 8, ly + 6);
      ctx.closePath();
      ctx.fill();
    }
  }

  // ---- Loop ----
  function loop(t) {
    const dt = Math.min(0.033, (t - lastTime) / 1000 || 0);
    lastTime = t;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // ---- Start ----
  function start() {
    resetGame();
    state = 'play';
    paused = false;
    overlay.classList.add('hidden');
  }
  startBtn.addEventListener('click', start);
  window.addEventListener('keydown', e => {
    if ((state === 'menu' || state === 'over') && (e.key === 'Enter' || e.key === ' ')) start();
  });
})();
</script>
</body>
</html>
